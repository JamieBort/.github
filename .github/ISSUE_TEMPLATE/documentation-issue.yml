name: Documentation Issue
description: Report missing, outdated, or unclear documentation
title: ""
labels:
  - documentation
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the documentation issue. What part of the docs is affected?
    validations:
      required: true

  - type: textarea
    id: proposed-update
    attributes:
      label: Proposed Update
      description: Provide suggestions for correcting or improving the documentation.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Link to the relevant page, section, or resource.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other notes or context regarding this documentation issue.