name: Bug Report
description: Report a problem or unexpected behavior in the project
title: ""
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please describe the bug in detail. What is the problem you are experiencing?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Describe the steps needed to reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide the environment where the issue occurred.
      value: |
        - OS:
        - Browser / Version:
        - Project Version:
    validations:
      required: true

  - type: textarea
    id: screenshots-logs
    attributes:
      label: Screenshots / Logs
      description: Add any screenshots or logs to help explain the issue.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information that might help us debug the issue.